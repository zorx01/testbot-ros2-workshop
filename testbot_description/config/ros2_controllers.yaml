# ros2_control controller manager configuration for testbot.
#
# MANUAL EDIT (not from fusion2URDF) - this file was rewritten.
#
# The generated version declared position_controller AND velocity_controller,
# both forward_command_controller, both listing [Revolute_2, Revolute_4].
# display.launch.py spawned both as ACTIVE, so whichever started second hit
#   "Resource conflict: command interface Revolute_2/position is already
#    claimed"
# and silently failed. Neither could drive the robot anyway: a
# forward_command_controller takes raw per-joint values on
# /<name>/commands, not a Twist, so there was no way to say "go forward".
#
# Replaced by the standard differential-drive pair:
#   joint_state_broadcaster  - publishes /joint_states from the hardware
#   diff_drive_controller    - Twist in, wheel velocities out, odometry back
#
# wheel_separation and wheel_radius are measured from the DAE meshes:
#   wheel centres at y = +/-0.1381  ->  separation 0.2762 m
#   wheel mesh bbox 0.070 m across  ->  radius 0.035 m
# Getting either wrong scales the odometry, so they are the two numbers
# worth double-checking on a real robot.

controller_manager:
  ros__parameters:
    update_rate: 100          # Hz, the controller_manager loop rate
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # Loaded but left INACTIVE. It claims the same velocity interfaces as
    # diff_drive_controller, so activating both at once is the resource
    # conflict described above - which is exactly the point of the
    # "controller lifecycle" demo:
    #   ros2 control list_controllers
    #   ros2 control set_controller_state diff_drive_controller inactive
    #   ros2 control set_controller_state wheel_velocity_controller active
    wheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController


joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true


diff_drive_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names:  ["Revolute_2"]
    right_wheel_names: ["Revolute_4"]

    wheel_separation: 0.2762
    wheel_radius: 0.035

    # Fudge factors for calibrating odometry against a tape measure.
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # false = integrate the measured wheel positions (real odometry).
    # true  = integrate the commanded Twist, which never reports slip.
    open_loop: false
    position_feedback: true

    # Publish the odom -> base_link transform. Turn this off once a
    # localisation stack (AMCL, robot_localization) owns that edge.
    enable_odom_tf: true

    # Stop the robot if no Twist arrives for this long. Without it a
    # dropped teleop connection leaves the robot driving away.
    cmd_vel_timeout: 0.5

    # false -> plain geometry_msgs/Twist on
    #          /diff_drive_controller/cmd_vel_unstamped
    # true  -> geometry_msgs/TwistStamped on
    #          /diff_drive_controller/cmd_vel
    use_stamped_vel: false

    # Wheel limit is 30 rad/s; 30 * 0.035 = 1.05 m/s, so cap below that.
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 3.0
    angular.z.min_velocity: -3.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 3.0
    angular.z.min_acceleration: -3.0


wheel_velocity_controller:
  ros__parameters:
    use_sim_time: true
    joints: [Revolute_2, Revolute_4]
    interface_name: velocity
